# Builds the ASP.NET Web Forms site (.NET Framework 4.8).
# Web Site projects need the .NET Framework MSBuild / ASP.NET compiler,
# which only exist on Windows, so `dotnet build` on Linux cannot be used.

name: .NET Framework

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Build
      run: msbuild "Grocery Shop.sln" /p:Configuration=Debug /nologo /v:m
